<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
        }

        .slide {
            max-width: 1280px;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #ffffff;
            border-radius: 2.5rem;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.4), 0 10px 20px -5px rgba(0, 0, 0, 0.2);
            overflow: visible;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .moving-band {
            height: 18px;
            width: 100%;
            background: linear-gradient(90deg, #1677ff, #ff4d6d, #00ffff, #b967ff, #ff4d6d, #1677ff);
            background-size: 400% 100%;
            animation: rgbBand 4s linear infinite;
            border-top-left-radius: 2.5rem;
            border-top-right-radius: 2.5rem;
        }

        @keyframes rgbBand {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .content {
            flex: 1;
            padding: 2rem 5rem 1.5rem 5rem;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            position: relative;
            height: 100%;
        }

        /* LARGER RGB TITLE */
        .main-title {
            font-size: 5.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1.2rem;
            line-height: 1.1;
            position: relative;
            text-align: center;
            background: linear-gradient(90deg, #1677ff, #ff4d6d, #00c3ff, #b967ff, #1677ff);
            background-size: 400% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgbTitle 5s ease infinite;
        }

        @keyframes rgbTitle {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 5px;
            background: linear-gradient(90deg, #1677ff, #ff4d6d, #00c3ff);
            border-radius: 4px;
        }

        .contents-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem 1.2rem;
            margin: 2rem 0 1rem 0;
            flex: 1;
        }

        .grid-item {
            background: #f8faff;
            border-radius: 1.8rem;
            padding: 1.8rem 1rem 1.5rem 1.5rem;
            transition: all 0.25s ease;
            border: 2px solid rgba(22, 119, 255, 0.15);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            box-shadow: 0 8px 18px -8px rgba(0,0,0,0.1);
            height: 100%;
        }

        .grid-item:hover {
            background: #ffffff;
            border-color: #b967ff;
            box-shadow: 0 25px 30px -14px rgba(185, 103, 255, 0.5);
            transform: translateY(-4px);
        }

        .item-number {
            font-size: 2.5rem;
            font-weight: 700;
            font-style: italic;
            background: linear-gradient(90deg, #1677ff, #ff4d6d);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 0.8rem;
            transition: color 0.2s;
        }

        .item-heading {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.3;
            color: #11213b;
            text-transform: uppercase;
        }

        .grid-item:hover .item-heading {
            background: linear-gradient(90deg, #1677ff, #b967ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-btn-side {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1677ff, #b967ff);
            color: white;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(22, 119, 255, 0.5);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }

        .nav-btn-side:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 8px 20px rgba(185, 103, 255, 0.7);
        }

        .nav-btn-side.prev {
            left: 15px;
            background: linear-gradient(135deg, #4a5568, #2d3748);
        }

        .nav-btn-side.next {
            right: 15px;
        }

        .footer-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 2rem;
            margin-top: 0.2rem;
            padding-top: 0.8rem;
            border-top: 1px dashed rgba(22, 119, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="moving-band"></div>
        
        <div class="content">
            <button class="nav-btn-side prev" onclick="window.previousPage()" title="Previous page">←</button>
            <button class="nav-btn-side next" onclick="window.nextPage()" title="Next page">→</button>
            
            <!-- RGB GRADIENT TITLE -->
            <div class="main-title">CONTENTS</div>
            
            <div class="contents-grid">
                <div class="grid-item" onclick="goToPage('C Introduction.html')"><div class="item-number">01</div><div class="item-heading">INTRODUCTION</div></div>
                <div class="grid-item" onclick="goToPage('D Aim.html')"><div class="item-number">02</div><div class="item-heading">AIM</div></div>
                <div class="grid-item" onclick="goToPage('E Components.html')"><div class="item-number">03</div><div class="item-heading">COMPONENTS</div></div>
                <div class="grid-item" onclick="goToPage('F Working Principle.html')"><div class="item-number">04</div><div class="item-heading">WORKING</div></div>
                <div class="grid-item" onclick="goToPage('G Apllication.html')"><div class="item-number">05</div><div class="item-heading">APPLICATIONS</div></div>
                <div class="grid-item" onclick="goToPage('H Conclusion.html')"><div class="item-number">06</div><div class="item-heading">CONCLUSION</div></div>
            </div>
        </div>
    </div>

    <script>
        const pages = [
            'A Main Slide.html',
            'B Index.html',
            'C Introduction.html',
            'D Aim.html',
            'E Components.html',
            'F Working Principle.html',
            'G Apllication.html',
            'H Conclusion.html',
            'I Thank you.html'
        ];

        const currentFile = window.location.pathname.split('/').pop();
        let currentIndex = pages.indexOf(currentFile);
        if (currentIndex === -1) currentIndex = 1;

        window.nextPage = function() {
            window.location.href = pages[(currentIndex + 1) % pages.length];
        };

        window.previousPage = function() {
            window.location.href = pages[(currentIndex - 1 + pages.length) % pages.length];
        };

        window.goToPage = function(filename) {
            window.location.href = filename;
        };

        document.addEventListener('keydown', function(event) {
            if (event.key === ' ' || event.key === 'Spacebar' || event.key === 'Enter' || event.key === 'ArrowRight') {
                event.preventDefault();
                window.nextPage();
            }
            else if (event.key === 'ArrowLeft') {
                event.preventDefault();
                window.previousPage();
            }
        });

        function addPageIndicator() {
            const indicator = document.createElement('div');
            indicator.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 30px;
                background: rgba(22, 119, 255, 0.9);
                color: white;
                padding: 8px 20px;
                border-radius: 30px;
                font-size: 0.9rem;
                font-weight: 600;
                z-index: 9999;
                box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            `;
            indicator.textContent = `Page ${currentIndex + 1} of ${pages.length}`;
            document.body.appendChild(indicator);
        }

        window.addEventListener('load', addPageIndicator);
    </script>
</body>
</html>
