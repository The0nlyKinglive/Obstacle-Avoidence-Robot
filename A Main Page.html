<!DOCTYPE html>
<html>
<head>
<title>Anime Rainbow Neon</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap" rel="stylesheet">

<style>
body{
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.anime-rainbow{
    font-size: clamp(30px, 8vw, 90px);  /* Responsive size */
    font-weight:800;
    font-family:'Orbitron', sans-serif;
    text-align:center;
    background: linear-gradient(
        90deg,
        red, orange, yellow, lime, cyan, blue, magenta, red
    );
    background-size: 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 2px white;
    text-shadow:
        0 0 10px rgba(255,255,255,0.6),
        0 0 20px rgba(0,255,255,0.7),
        0 0 40px rgba(255,0,255,0.7);
    animation: rainbowMove 3s linear infinite;
}

@keyframes rainbowMove{
    0%{
        background-position: 0%;
    }
    100%{
        background-position: 400%;
    }
}
</style>
</head>
<body>

<div class="anime-rainbow"><a href="A Main Slide.html">Obstacle Avoidence Robot Using Quarky</a> </div>

</body>
</html>
