<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obstacle Avoidance Robot · Quarky slide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e8f0fe;  /* Lighter background */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 20px;
        }

        /* main card – lighter theme */
        .yor-card {
            --card-bg: rgb(255, 255, 255);
            --accent-blue: #1677ff;

            max-width: 1248px;
            width: 100%;
            background: var(--card-bg);
            background-color: rgb(255, 255, 255);
            border-radius: 40px;
            box-shadow: 0 25px 50px -8px rgba(22, 119, 255, 0.2), 0 8px 20px -6px rgba(22, 119, 255, 0.15);
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(0);
            transition: all 0.2s ease;
            border: 1px solid rgba(22, 119, 255, 0.2);
        }

        /* flexible two‑column layout: left = image, right = text */
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            min-height: 520px;
        }

        /* left image block – lighter background */
        .card-image-panel {
            flex: 0 0 66%;
            max-width: 66%;
            background: linear-gradient(145deg, #e6f0ff, #d4e4ff); /* Light blue gradient */
            position: relative;
            overflow: hidden;
            min-height: 460px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-image-panel img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: 50% 50%;
            display: block;
            background: #ffffff;
            transition: transform 0.3s ease;
        }

        /* right side – title + extra spacing */
        .card-content-panel {
            flex: 1;
            max-width: 34%;
            background: rgb(255, 255, 255);
            padding: 2.5rem 2rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        /* decorative line / hr – animated gradient */
        .yor-hr {
            margin: 2rem 0 0.5rem 0;
            border: none;
            height: 4px;
            background: linear-gradient(90deg, #1677ff, #ff9f4b, #00ffff, #1677ff, #ff4d6d, #1677ff);
            background-size: 400% 100%;
            animation: moveRainbow 6s linear infinite;
            border-radius: 6px;
            opacity: 0.8;
            width: 100%;
        }

        @keyframes moveRainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* main title with MOVING GRADIENT */
        .slide-title {
            font-size: 3.45rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
            color: #0c1a2b;
            margin-bottom: 1rem;
            word-break: break-word;
            text-wrap: pretty;
        }

        /* MOVING GRADIENT TEXT - THIS IS WHAT YOU WANT */
        .slide-title span {
            background: linear-gradient(90deg, #1677ff, #ff4d6d, #00c3ff, #b967ff, #1677ff);
            background-size: 300% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            animation: moveGradient 4s ease infinite;
            display: inline-block;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* additional smaller text */
        .empty-placeholder {
            font-size: 1rem;
            color: #5f6c80;
            padding: 0.25rem 0;
            opacity: 0.8;
            border-left: 3px solid #1677ff;
            padding-left: 1rem;
            margin-top: 0.75rem;
        }

        .empty-placeholder .icon {
            font-size: 1.4rem;
            margin-right: 6px;
            display: inline-block;
            vertical-align: middle;
        }

        .hidden-meta {
            display: none;
        }

        /* responsive */
        @media (max-width: 900px) {
            .card-grid {
                flex-direction: column;
            }
            .card-image-panel, .card-content-panel {
                flex: 0 0 100%;
                max-width: 100%;
            }
            .card-image-panel {
                min-height: 400px;
            }
            .slide-title {
                font-size: 2.8rem;
            }
        }

        @media (max-width: 480px) {
            .slide-title {
                font-size: 2.2rem;
            }
        }

        /* quarky logo - lighter style */
        .quarky-logo {
            position: absolute;
            bottom: 20px;
            right: 28px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1677ff;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid rgba(22,119,255,0.4);
            box-shadow: 0 2px 6px rgba(22,119,255,0.1);
            letter-spacing: 0.3px;
            z-index: 5;
        }

        .quarky-logo strong {
            color: #1677ff;
            font-weight: 600;
        }

        /* card decoration */
        .yor-card::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: 40px;
            border: 1px solid rgba(22,119,255,0.3);
            mix-blend-mode: normal;
        }
    </style>
	<!-- FIXED NAVIGATION SCRIPT -->
<script>
    // ===== CORRECT PAGE ORDER =====
    const pages = [
        'A Main Slide.html',      // Page 1
        'B Index.html',           // Page 2
        'C Introduction.html',    // Page 3
        'D Aim.html',             // Page 4
        'E Components.html',      // Page 5
        'F Working Principle.html', // Page 6
        'G Apllication.html',      // Page 7
        'H Conclusion.html',       // Page 8
        'I Thank you.html'         // Page 9
    ];

    // Get current page
    const currentFile = window.location.pathname.split('/').pop();
    let currentIndex = pages.indexOf(currentFile);
    if (currentIndex === -1) currentIndex = 0;

    // Navigation functions
    window.nextPage = function() {
        const nextIndex = (currentIndex + 1) % pages.length;
        window.location.href = pages[nextIndex];
    };

    window.previousPage = function() {
        const prevIndex = (currentIndex - 1 + pages.length) % pages.length;
        window.location.href = pages[prevIndex];
    };

    // Keyboard
    document.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter' || e.key === 'ArrowRight') {
            e.preventDefault();
            window.nextPage();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            window.previousPage();
        }
    });

    // Add buttons
    window.onload = function() {
        const nav = document.createElement('div');
        nav.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:99999; background:white; padding:10px 20px; border-radius:50px; border:2px solid #1677ff; box-shadow:0 5px 20px rgba(0,0,0,0.2);';
        nav.innerHTML = `
            <button onclick="window.previousPage()" style="background:#4a5568; color:white; border:none; padding:8px 20px; border-radius:30px; cursor:pointer; font-size:16px;">← Prev</button>
            <span style="padding:8px 15px; color:#1677ff; font-weight:bold;">Page ${currentIndex+1} of 9</span>
            <button onclick="window.nextPage()" style="background:#1677ff; color:white; border:none; padding:8px 20px; border-radius:30px; cursor:pointer; font-size:16px;">Next →</button>
        `;
        document.body.appendChild(nav);
    };
</script>
</head>
<body>
    <!-- main card -->
    <div class="yor-card" id="416017884352664" data-anchor="416017881491590">
        <div class="hidden-meta" id="416017881491590"></div>
        <div class="hidden-meta" id="416017882750750"></div>

        <div class="card-grid">
            <!-- left image panel -->
            <div class="card-image-panel">
                <img src="Slide 1"
                     loading="lazy"
                     width="1248"
                     height="832"
                     style="aspect-ratio: 1248 / 832;"
                     data-image-id="416017882750750"
                     data-anchor="416017881491590"
                     data-source="image.ai-generated"
                     data-media-type="image"
                />
            </div>

            <!-- right side content -->
            <div class="card-content-panel">
                <div class="yor-text empty-placeholder" id="416017884352655" data-anchor="416017881831852">
                    <span style="opacity:0.8; color:#1677ff;">innovate · sense · avoid</span>
                </div>

                <!-- main title with MOVING GRADIENT -->
                <div class="yor-text" id="416017884352661" data-anchor="416017881831858">
                    <h1 class="slide-title">
                        <span>Obstacle Avoidance</span><br/>
                        Robot using Quarky
                    </h1>
                </div>

                <!-- horizontal rule with moving colors -->
                <hr class="yor-hr" id="416017884352662" data-anchor="416017881831860" color="inherit" />

                <!-- subtle note -->
                <div style="margin-top: 2rem; font-size: 0.75rem; color: #8895aa; border-top: 1px dashed #1677ff40; padding-top: 0.8rem;">
                    <span style="color:#1677ff;">✦</span> autonomous navigation system
                </div>

                <!-- quarky logo -->
                <div class="quarky-logo">
                    <strong>◈ Quarky</strong> · smart navigation
                </div>
            </div>
        </div>

        <div style="display: none;" data-template-config="{}" data-show-logo="default" data-show-card-decorate="default"></div>
    </div>

    <!-- NAVIGATION SCRIPT - PASTE THIS BEFORE </body> -->
    <script>
        // ===== NAVIGATION CONFIGURATION =====
        const pages = [
            'A Main Slide.html',      // Page 1
            'B Index.html',           // Page 2
            'C Introduction.html',    // Page 3
            'D Aim.html',             // Page 4
            'E Components.html',      // Page 5
            'F Working Principle.html', // Page 6
            'G Apllication.html',      // Page 7
            'H Conclusion.html',       // Page 8
            'I Thank you.html'         // Page 9
        ];

        // Get current page filename
        const currentFile = window.location.pathname.split('/').pop();
        let currentIndex = pages.indexOf(currentFile);
        if (currentIndex === -1) currentIndex = 0;

        // Navigation functions
        function nextPage() {
            const nextIndex = (currentIndex + 1) % pages.length;
            window.location.href = pages[nextIndex];
        }

        function previousPage() {
            const prevIndex = (currentIndex - 1 + pages.length) % pages.length;
            window.location.href = pages[prevIndex];
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            if (event.key === ' ' || event.key === 'Spacebar' || event.key === 'Enter' || event.key === 'ArrowRight') {
                event.preventDefault();
                nextPage();
            }
            else if (event.key === 'ArrowLeft') {
                event.preventDefault();
                previousPage();
            }
        });

        // Add navigation buttons
        function addNavigationButtons() {
            const navContainer = document.createElement('div');
            navContainer.className = 'navigation-buttons';
            navContainer.innerHTML = `
                <button class="nav-btn prev-btn" onclick="previousPage()" title="Previous page (Left Arrow)">
                    <span>←</span> Prev
                </button>
                <div class="page-indicator">
                    Page ${currentIndex + 1} of ${pages.length}
                </div>
                <button class="nav-btn next-btn" onclick="nextPage()" title="Next page (Space/Enter/Right Arrow)">
                    Next <span>→</span>
                </button>
            `;
            
            // Add styles
            const style = document.createElement('style');
            style.textContent = `
                .navigation-buttons {
                    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
                    display: flex; gap: 15px; z-index: 9999;
                    background: rgba(255, 255, 255, 0.95);
                    backdrop-filter: blur(10px);
                    padding: 8px 15px; border-radius: 50px;
                    box-shadow: 0 5px 20px rgba(22, 119, 255, 0.2);
                    border: 1px solid rgba(22, 119, 255, 0.3);
                    font-family: 'Inter', sans-serif;
                }
                .nav-btn {
                    background: linear-gradient(135deg, #1677ff, #3a8cff);
                    color: white; border: none; padding: 8px 20px;
                    border-radius: 30px; font-size: 1rem; font-weight: 500;
                    cursor: pointer; display: flex; align-items: center;
                    gap: 8px; transition: all 0.2s ease;
                    box-shadow: 0 4px 10px rgba(22, 119, 255, 0.3);
                }
                .nav-btn.prev-btn { background: linear-gradient(135deg, #4a5568, #2d3748); }
                .nav-btn:hover { transform: translateY(-2px); }
                .page-indicator {
                    background: rgba(22, 119, 255, 0.1);
                    padding: 8px 15px; border-radius: 30px;
                    font-size: 0.9rem; font-weight: 600;
                    color: #1677ff; border: 1px solid rgba(22, 119, 255, 0.3);
                    min-width: 100px; text-align: center;
                }
            `;
            document.head.appendChild(style);
            document.body.appendChild(navContainer);
        }

        window.addEventListener('load', addNavigationButtons);
    </script>
</body>

</html>
